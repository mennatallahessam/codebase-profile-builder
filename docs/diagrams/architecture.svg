        <rect x="508" y="564" width="16" height="12" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="532" y="573" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External service</text>


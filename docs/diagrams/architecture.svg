        <rect x="148" y="564" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="172" y="573" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Analysis module</text>

        <rect x="284" y="564" width="16" height="12" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="308" y="573" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">SQLite store</text>

        <rect x="400" y="564" width="16" height="12" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>

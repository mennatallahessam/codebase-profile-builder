        <text x="564" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">streaks · collab graph</text>

        <!-- Node 6: Prompt Builder (backend role) -->
        <rect x="492" y="304" width="144" height="64" rx="6" fill="#f5f5f5"/>

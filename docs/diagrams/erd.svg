<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="erd-title erd-desc" id="erd-root">
        <title id="erd-title">Codebase Personality Profiler entity-relationship diagram</title>
        <desc id="erd-desc">Entity-relationship model showing the Repository aggregate root connected to Metric and Contributor entities, with Contributor linked 1-to-1 to ContributorProfile and ContributorMetric.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #erd-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #erd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #erd-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#erd-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="erd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="erd-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="erd-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Relationship lines (drawn first, behind entity boxes) -->
        <!-- 1. Repository — Contributor (1:N "HAS") -->
        <line x1="280" y1="160" x2="380" y2="160" stroke="#bf4520" stroke-width="1.2"/>
        <!-- 2. Repository — Metric (1:N "RECORDS") -->
        <path d="M 280,280 H 324 Q 332,280 332,288 V 372 Q 332,380 340,380 H 380"
              fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <!-- 3. Contributor — ContributorProfile (1:0..1 "PROFILES") -->
        <line x1="600" y1="140" x2="700" y2="140" stroke="#4f5d75" stroke-width="1.2"/>
        <!-- 4. Contributor — ContributorMetric (1:0..1 "TRACKS") -->
        <path d="M 600,200 H 644 Q 652,200 652,208 V 352 Q 652,360 660,360 H 700"
              fill="none" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- Cardinality labels (8px gap from line) -->
        <!-- Repository (1) — Contributor (N) -->
        <rect x="288" y="140" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="294" y="149" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <rect x="360" y="140" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="366" y="149" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

        <!-- Repository (1) — Metric (N) -->
        <rect x="288" y="260" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="294" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <rect x="360" y="360" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="366" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

        <!-- Contributor (1) — ContributorProfile (0..1) -->
        <rect x="608" y="120" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="614" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <rect x="664" y="120" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="678" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>


<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-title flowchart-desc" id="flowchart-root">
        <title id="flowchart-title">Repository analysis and profiling flowchart</title>
        <desc id="flowchart-desc">Flowchart showing how POST /api/analyze checks the 1-hour SQLite cache, fetches GitHub data and computes metrics on cache miss, branches between OpenAI and the mock archetype engine, and persists the final report.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #flowchart-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #flowchart-root { font-family: var(--font-sans); color: var(--color-ink); }
      #flowchart-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#flowchart-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="flowchart-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="flowchart-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="flowchart-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- 1. Start -> Diamond 1 (Cached < 1 hr?) -->
        <line x1="400" y1="88" x2="400" y2="116" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flowchart-arrow)"/>

        <!-- 2. Diamond 1 "YES" -> Return Cached Report -->
        <line x1="500" y1="156" x2="640" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flowchart-arrow)"/>

        <!-- 3. Diamond 1 "NO" -> Fetch GitHub & Compute -->
        <line x1="400" y1="196" x2="400" y2="232" stroke="#bf4520" stroke-width="1.4" marker-end="url(#flowchart-arrow-accent)"/>

        <!-- 4. Fetch GitHub & Compute -> Diamond 2 (OpenAI Key Set?) -->
        <line x1="400" y1="288" x2="400" y2="320" stroke="#bf4520" stroke-width="1.4" marker-end="url(#flowchart-arrow-accent)"/>

        <!-- 5. Diamond 2 "NO" -> Mock Archetype Engine -->
        <line x1="500" y1="360" x2="640" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flowchart-arrow)"/>

        <!-- 6. Diamond 2 "YES" -> Call OpenAI & Upsert DB (happy path coral) -->
        <line x1="400" y1="400" x2="400" y2="444" stroke="#bf4520" stroke-width="1.4" marker-end="url(#flowchart-arrow-accent)"/>

        <!-- 7. Mock Archetype Engine -> Call OpenAI & Upsert DB (rejoin via orthogonal elbow) -->
        <path d="M 736,388 V 464 Q 736,472 728,472 H 496"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flowchart-arrow)"/>

        <!-- Arrow labels (opaque mask + 8px gap from stroke) -->
        <rect x="556" y="136" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="570" y="145" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="408" y="208" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="217" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <rect x="556" y="340" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="568" y="349" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <rect x="408" y="416" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="422" y="425" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="580" y="452" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="608" y="461" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FALLBACK</text>

        <!-- Start Oval: POST /api/analyze -->
        <rect x="312" y="40" width="176" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="312" y="40" width="176" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="400" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">POST /api/analyze</text>
        <text x="400" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">owner / repo</text>

        <!-- Diamond 1: Cached < 1 hr? -->
        <polygon points="400,116 500,156 400,196 300,156" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cached in DB</text>
        <text x="400" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&lt; 1 hour old?</text>

        <!-- End Oval (Branch): Return Cached Report -->
        <rect x="640" y="132" width="192" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="640" y="132" width="192" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="736" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Return Cached Report</text>
        <text x="736" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fromCache: true</text>

        <!-- Step 1: Fetch GitHub & Compute Metrics -->
        <rect x="304" y="232" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="232" width="192" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fetch &amp; Compute</text>
        <text x="400" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub API · metrics · health</text>

        <!-- Diamond 2: OpenAI Key Set? -->
        <polygon points="400,320 500,360 400,400 300,360" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenAI API Key</text>
        <text x="400" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">configured?</text>

        <!-- Step 2 (Branch): Mock Archetype Engine -->
        <rect x="640" y="332" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="332" width="192" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="736" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mock Profile Engine</text>
        <text x="736" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deterministic rules</text>

        <!-- End Oval (Focal Coral): Profile & Persist Report -->
        <rect x="304" y="444" width="192" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="304" y="444" width="192" height="56" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="400" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Profile &amp; Upsert DB</text>
        <text x="400" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPT-4o · SQLite · JSON</text>

        <!-- Legend strip (bottom 60px) -->
        <line x1="40" y1="532" x2="920" y2="532" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="564" width="24" height="12" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="72" y="573" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

        <rect x="212" y="564" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="244" y="573" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <polygon points="384,570 396,564 408,570 396,576" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="420" y="573" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

        <line x1="564" y1="570" x2="592" y2="570" stroke="#bf4520" stroke-width="1.4" marker-end="url(#flowchart-arrow-accent)"/>
        <text x="600" y="573" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path</text>

        <line x1="704" y1="570" x2="732" y2="570" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flowchart-arrow)"/>
        <text x="740" y="573" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch / fallback</text>
      </svg>
